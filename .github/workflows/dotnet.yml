name: GLMS Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore GLMS.sln

    - name: Build solution
      run: dotnet build GLMS.sln --no-restore --configuration Release

    - name: Run all tests
      run: dotnet test GLMS.Tests/GLMS.Tests.csproj --configuration Release --no-build --verbosity normal
