name: .NET Build and Test (Unit + Integration)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build all projects
      run: dotnet build --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName~ServiceRequestAppServiceTests|FullyQualifiedName~CurrencyServiceTests|FullyQualifiedName~FileServiceTests" --logger "console;verbosity=normal"

    - name: Run integration tests (in-process API with in-memory DB)
      run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName~IntegrationTests" --logger "console;verbosity=normal"
