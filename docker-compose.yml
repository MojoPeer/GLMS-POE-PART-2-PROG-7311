# PROG7311 POE Part 3 - Docker Compose
# Spins up the full GLMS ecosystem:
#   Container 1: sql-server-db   (SQL Server database)
#   Container 2: glms-backend-api (ASP.NET Core Web API)
#   Container 3: glms-frontend-web (ASP.NET Core MVC)

version: '3.8'

services:

  # ─── Container 1: SQL Server Database ───────────────────────────────────────
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - glms-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong@Passw0rd", "-Q", "SELECT 1"]
      interval: 10s
      retries: 10
      start_period: 30s

  # ─── Container 2: GLMS Web API (Backend) ────────────────────────────────────
  glms-backend-api:
    build:
      context: .
      dockerfile: GLMS.API/Dockerfile
    container_name: glms-backend-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:80"
      ConnectionStrings__DefaultConnection: "Server=sql-server-db;Database=GLMSApiDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true;"
      Jwt__Key: "GLMS_JWT_SuperSecretKey_2026_PROG7311_POE_Part3"
      Jwt__Issuer: "GLMS.API"
      Jwt__Audience: "GLMS.MVC"
    ports:
      - "5001:80"
    depends_on:
      sql-server-db:
        condition: service_healthy
    networks:
      - glms-network

  # ─── Container 3: GLMS MVC Frontend ─────────────────────────────────────────
  glms-frontend-web:
    build:
      context: .
      dockerfile: GLMS/Dockerfile
    container_name: glms-frontend-web
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:80"
      ApiSettings__BaseUrl: "http://glms-backend-api/"
    ports:
      - "5000:80"
    depends_on:
      - glms-backend-api
    networks:
      - glms-network

networks:
  glms-network:
    driver: bridge

volumes:
  sqldata:
